# Tempest default heuristic configuration.
# A target repo may override any of this via .tempest/tempest.config.yaml
# (deep-merged on top of these defaults; user values win).

# ---------------------------------------------------------------------------
# Boundary classification: ordered heuristic chain, first match wins.
# Unmatched nodes/files default to NON-PROD (safe default).
# ---------------------------------------------------------------------------
boundary:
  # (1) Explicit glob overrides — highest priority after manual overrides.
  # Glob is matched against the node's source_file path (posix-style,
  # relative to repo root).
  path_overrides:
    # Real repos mark prod via config files, not folders.
    prod:
      - "*/production.py"
      - "*/production.*"
      - "*settings/prod*"
      - "*config/prod*"
    non_prod: []

  # (2) Filename / env-file markers.
  env_file_markers:
    prod:
      - ".env.prod"
      - ".env.production"
      - "prod.env"
      - "production.env"
    dev:
      - ".env.dev"
      - ".env.development"
      - "dev.env"
    test:
      - ".env.test"
      - "test.env"
    staging:
      - ".env.staging"
      - "staging.env"
    qa:
      - ".env.qa"
      - "qa.env"

  # (2b) Filename markers — matched against the file BASENAME (case-insensitive
  # fnmatch glob). These generalize non-prod detection beyond folders: a
  # test_*/seed_*/*factory* file is non-prod wherever it lives, so a leak in a
  # weirdly-organized repo is still caught. Checked before folder markers.
  filename_markers:
    test:
      - "test_*"
      - "*_test.*"
      - "*_tests.*"
      - "tests.*"
      - "conftest.*"
      - "*_spec.*"
      - "spec_*"
    dev:
      - "seed*"
      - "*_seed.*"
      - "*seeds.*"
      - "*factory.*"
      - "*factories.*"
      - "*fixture*"
      - "fake_*"
      - "mock_*"
      - "dummy_*"
      - "demo*"
      - "example*"
      - "sample_*"
      - "benchmark*"
      - "bench_*"
      - "scratch*"
      - "playground*"
      - "backfill*"
      - "*.ipynb"

  # (3) Folder-naming conventions. Matched as a path-segment substring
  # against the node's source_file (case-insensitive).
  folder_markers:
    prod:
      - "prod"
      - "production"
    staging:
      - "staging"
      - "stage"
    qa:
      - "qa"
    test:
      - "test"
      - "tests"
      - "__tests__"
      - "spec"
      - "specs"
      - "e2e"
      - "fixtures"
      - "factories"
      - "testdata"
      - "mocks"
      - "seed"
      - "seeds"
    dev:
      - "dev"
      - "development"
      - "local"
      - "sandbox"
      - "scripts"
      - "tooling"
      - "examples"
      - "samples"
      - "notebooks"

  # (4) Connection-string / identifier regex heuristics on string literals
  # near a node's source_location. Any match tags the node PROD.
  prod_identifier_patterns:
    - "prod-[a-z0-9\\-\\.]+"
    - "[a-z0-9\\-]+\\.prod\\.[a-z0-9\\.\\-]+"
    - "production[a-z0-9\\-_\\.]*"
    - "[a-z0-9\\-\\_]*-prod-[a-z0-9\\-\\_]*"

  # Minimum Shannon entropy (bits/char) for a string literal to be treated
  # as a plausible secret/credential when combined with a prod identifier
  # match nearby. Used by Rule (a).
  min_secret_entropy: 3.0

# Framework-import markers — the strongest signal that a file is non-prod
# (test/seed/dev) code regardless of its name or folder. If a node's source
# file contains one of these substrings, an otherwise-unclassified (NON_PROD)
# node is upgraded to TEST. Add your own homegrown test/fixture frameworks here.
nonprod_import_markers:
  - "import pytest"
  - "from pytest"
  - "import unittest"
  - "from unittest"
  - "import nose"
  - "import faker"
  - "from faker"
  - "factory_boy"
  - "from factory"
  - "import hypothesis"
  - "from hypothesis"
  - "import moto"
  - "from moto"
  - "import responses"
  - "import vcr"
  - "from freezegun"
  - "testcontainers"

# ---------------------------------------------------------------------------
# Production Boundary Node (PBN): PROD-tagged AND structurally a resource
# boundary. Matched against node label / norm_label (case-insensitive
# substring match).
# ---------------------------------------------------------------------------
pbn_patterns:
  database:
    - "database"
    - "db"
    - "postgres"
    - "mysql"
    - "mongo"
    - "redis"
    - "sql"
    - "cursor"
    - "connection"
    - "session"
    - "orm"
    - "repository"
  storage:
    - "s3"
    - "bucket"
    - "blob"
    - "storage"
    - "filesystem"
    - "datalake"
  messaging:
    - "kafka"
    - "queue"
    - "topic"
    - "publisher"
    - "producer"
    - "sqs"
    - "sns"
    - "eventbus"
    - "broker"
  network:
    - "apiclient"
    - "httpclient"
    - "endpoint"
    - "webhook"
    - "gateway"

# ---------------------------------------------------------------------------
# Resource-client patterns: PRECISE library/client identifiers that
# unambiguously mean "this code talks to an external stateful resource"
# (a DB driver, a cloud SDK client, a queue producer). Unlike pbn_patterns
# (broad label substrings, PROD-gated), these fire REGARDLESS of env tag —
# because on real repos the resource itself usually sits in no prod/ folder;
# it's just "the database", reached by both prod and (leaking) non-prod code.
# A node matching one of these is a Production Boundary Node UNLESS it is an
# explicit local/test double (env DEV or TEST — e.g. a LocalDatabase stub).
# Matched as a case-insensitive substring against the node label/norm_label.
# ponytail: boto3.client type is arg-dependent (s3 vs sqs); we can't see the
# arg from the label, so it's mapped to storage (the canonical leak target) —
# scanner_findings (s3:// URIs) give precise typing when present.
resource_client_patterns:
  database:
    - "create_engine"
    - "sessionmaker"
    - "psycopg2"
    - "psycopg"
    - "pymysql"
    - "asyncpg"
    - "mongoclient"
    - "pymongo"
    - "sqlalchemy"
    - "databaseclient"
    - "db_connect"
  storage:
    - "boto3.client"
    - "boto3.resource"
    - "botocore"
    - "google.cloud.storage"
    - "storage.client"
    - "blobserviceclient"
    - "s3client"
    - "minio"
  messaging:
    - "kafkaproducer"
    - "kafkaconsumer"
    - "pika.blockingconnection"
    - "celery"
    - "sqsclient"

# ---------------------------------------------------------------------------
# Multi-language resource-client REGEXES (Phase 3). graphify labels the DB/
# cache/queue access CLASS after the app (CatalogContext, RedisCartStore), not
# the client library, so label-substring matching (resource_client_patterns)
# misses them in C#/Go/Java/etc. These regexes match the actual client
# call/inheritance site in SOURCE TEXT; the multi-lang augment pass anchors a
# synthetic PBN of the given type to the nearest enclosing code node. Applied
# to non-Python files only (Python has its own AST augment pass). Redis is
# typed `database` (stateful data resource) so Rules (b)/(c) cover it.
resource_client_regexes:
  database:
    - ':\s*DbContext\b'                      # C# EF Core context class
    - '\bUseNpgsql\s*\('
    - '\bUseSqlServer\s*\('
    - '\bAddNpgsqlDbContext\b'
    - '\bAddSqlServerDbContext\b'
    - '\bnew\s+SqlConnection\s*\('
    - '\bnew\s+NpgsqlConnection\s*\('
    - '\bIDistributedCache\b'                # C# distributed cache (often Redis)
    - '\bConnectionMultiplexer\.Connect\s*\('  # StackExchange.Redis
    - '\bsql\.Open\s*\('                     # Go database/sql
    - '\bpgxpool\.(New|Connect|ParseConfig)'  # Go pgx
    - '\bpgx\.Connect\s*\('
    - '\bsqlx\.(Open|Connect)\s*\('
    - '\bgorm\.Open\s*\('
    - '\bmongo\.Connect\s*\('
    - '\bmongo\.NewClient\s*\('
    - '\bredis\.NewClient\s*\('              # Go go-redis
    - '\bredis\.NewFailoverClient\s*\('
    - '\bnew\s+Jedis\s*\('                   # Java Redis
    - '\bmongoose\.connect\s*\('             # Node
  storage:
    - '\bs3\.New(FromConfig)?\s*\('          # Go AWS SDK
    - '\bstorage\.NewClient\s*\('            # Go GCS
    - '\bBlobServiceClient\b'                # C# Azure Blob
    - '\bnew\s+AmazonS3Client\s*\('          # C# AWS
  messaging:
    - '\bkafka\.New(Writer|Reader)\b'        # Go segmentio/kafka-go
    - '\bsarama\.New(SyncProducer|AsyncProducer|Consumer)\b'
    - '\bamqp\.Dial\s*\('                    # RabbitMQ
    - '\bnew\s+ConnectionFactory\s*\('       # Java RabbitMQ/JMS

# ---------------------------------------------------------------------------
# Policy rule (b): edge relations counted as "writes to" / structurally
# reaches a PBN via calls/uses.
# ---------------------------------------------------------------------------
write_edge_relations:
  - "calls"
  - "instantiates"
  - "uses"

# ---------------------------------------------------------------------------
# Rule (b) content fallback — DB-access operations detected in the SOURCE of
# non-prod code. graphify's AST graph does NOT model ORM/framework database
# access (a module-level `db = SQLAlchemy()`, attribute-chain `db.session.add`,
# or inheritance-injected `.save()`), so on real Flask/Django apps there is no
# PBN and no path for reachability to find. This catches those leaks by what
# the non-prod code textually DOES. Regex, matched line-by-line; only scanned
# in TEST/DEV-role files, so the app's own data layer is never flagged.
db_access_patterns:
  - '\.session\.(add|commit|delete|merge|flush|bulk_save_objects|bulk_insert_mappings|execute)'
  - '\.save\s*\('
  - '\.objects\.(create|bulk_create|update|delete|get_or_create|filter|all|raw)'
  - '\.execute\s*\('
  - 'create_engine\s*\('
  - '\.create_all\s*\('
  - '\.drop_all\s*\('
  - '\.bulk_(save|insert|create|update)'
  - '(?i)\b(INSERT\s+INTO|UPDATE\s+\w+\s+SET|DELETE\s+FROM)\b'

# Rule (b) content fallback prod-gate: a DB-op match above is only a leak if
# the file ALSO shows positive evidence it's really talking to prod — either
# an explicit prod config marker, or a prod-identifier/database_url literal
# (boundary.prod_identifier_patterns / scanner_patterns.database_url, reused
# from Rule a). Without this gate, any plain unit test calling
# .save()/.create_all() reads as a leak, which it isn't.
prod_config_markers:
  - "ProdConfig"
  - "ProductionConfig"
  - "prod_config"
  - "PROD_DATABASE"
  - "production_settings"

# Rule (b) structural: target labels matching these are the app's own
# connection lifecycle plumbing (open/close/teardown), not a data write —
# skip them so a test fixture booting/closing the real app isn't flagged.
# NOTE: deliberately excludes "connect" — that's the literal method name in
# augmented resource-client PBN labels (psycopg2.connect(), asyncpg.connect())
# and would suppress the real leaks those nodes exist to catch.
lifecycle_exclusions:
  - "close"
  - "disconnect"
  - "shutdown"
  - "teardown"
  - "startup"
  - "dispose"
  - "on_startup"
  - "on_shutdown"

# ---------------------------------------------------------------------------
# Policy rule (c): non-prod sink labels (log/debug/dump destinations).
# ---------------------------------------------------------------------------
sink_patterns:
  - "log"
  - "logger"
  - "logging"
  - "debug"
  - "dump"
  - "print"
  - "console"
  - "trace"

# Sensitive-data keywords: PROD nodes whose label/norm_label matches one of
# these (in addition to database/storage PBNs) are treated as prod_data
# sources for Rule (c).
sensitive_data_keywords:
  - "user"
  - "customer"
  - "account"
  - "payment"
  - "email"
  - "password"
  - "ssn"
  - "credential"
  - "token"
  - "pii"

# ---------------------------------------------------------------------------
# Known hardcoded prod identifiers (Rule a). Literal substrings; matched
# case-insensitively against string content near a node's source_location.
# ---------------------------------------------------------------------------
known_prod_identifiers: []

# Reachability path reconstruction cap (simple-path enumeration is
# exponential in dense graphs; keep this small).
max_paths_per_finding: 10
max_path_length: 50

# ---------------------------------------------------------------------------
# Scanner patterns for discovery. (Replaces LocalG scanners with YAML config)
# ---------------------------------------------------------------------------
scanner_patterns:
  aws_arn: 'arn:aws[a-zA-Z-]*:[a-z0-9-]+:[a-z0-9-]*:[0-9]{0,12}:[^\s<>''"`\\]+'
  aws_s3_uri: 's3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](?:/[^\s<>''"`\\]*)?'
  database_url: '(?:(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|mssql|sqlserver)://|jdbc:[a-z0-9]+://)[^\s<>''"`\\]+'
  azure_resource_id: '/subscriptions/[0-9a-f-]{32,36}/resourceGroups/[^/\s<>''"`\\]+/providers/Microsoft\.[^/\s<>''"`\\]+/[^/\s<>''"`\\]+/[^/\s<>''"`\\]+'
  azure_storage_url: 'https?://[a-z0-9]{3,24}\.(?:blob|dfs|file|queue|table)\.core\.windows\.net'
  azure_key_vault: 'https?://[a-z0-9-]{3,24}\.vault\.azure\.net'
  gcp_gcs_uri: 'gs://[a-z0-9][a-z0-9._-]{1,221}[a-z0-9]'
  gcp_service_account: '[a-z0-9._%+-]+@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com'

# ---------------------------------------------------------------------------
# Specific high-confidence secret patterns (ported from LocalG)
# ---------------------------------------------------------------------------
secret_patterns:
  aws_access_key_id: '\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'
  private_key: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
