# Tempest default heuristic configuration.
# A target repo may override any of this via .tempest/tempest.config.yaml
# (deep-merged on top of these defaults; user values win).

# ---------------------------------------------------------------------------
# Boundary classification: ordered heuristic chain, first match wins.
# Unmatched nodes/files default to NON-PROD (safe default).
# ---------------------------------------------------------------------------
boundary:
  # (1) Explicit glob overrides — highest priority after manual overrides.
  # Glob is matched against the node's source_file path (posix-style,
  # relative to repo root).
  path_overrides:
    # Real repos mark prod via config files, not folders.
    prod:
      - "*/production.py"
      - "*/production.*"
      - "*settings/prod*"
      - "*config/prod*"
    non_prod: []

  # (2) Filename / env-file markers.
  env_file_markers:
    prod:
      - ".env.prod"
      - ".env.production"
      - "prod.env"
      - "production.env"
    dev:
      - ".env.dev"
      - ".env.development"
      - "dev.env"
    test:
      - ".env.test"
      - "test.env"
    staging:
      - ".env.staging"
      - "staging.env"
    qa:
      - ".env.qa"
      - "qa.env"

  # (3) Folder-naming conventions. Matched as a path-segment substring
  # against the node's source_file (case-insensitive).
  folder_markers:
    prod:
      - "prod"
      - "production"
    staging:
      - "staging"
      - "stage"
    qa:
      - "qa"
    test:
      - "test"
      - "tests"
      - "__tests__"
      - "spec"
      - "specs"
      - "e2e"
      - "fixtures"
      - "factories"
      - "testdata"
      - "mocks"
      - "seed"
      - "seeds"
    dev:
      - "dev"
      - "development"
      - "local"
      - "sandbox"
      - "scripts"
      - "tooling"
      - "examples"
      - "samples"
      - "notebooks"

  # (4) Connection-string / identifier regex heuristics on string literals
  # near a node's source_location. Any match tags the node PROD.
  prod_identifier_patterns:
    - "prod-[a-z0-9\\-\\.]+"
    - "[a-z0-9\\-]+\\.prod\\.[a-z0-9\\.\\-]+"
    - "production[a-z0-9\\-_\\.]*"
    - "[a-z0-9\\-\\_]*-prod-[a-z0-9\\-\\_]*"

  # Minimum Shannon entropy (bits/char) for a string literal to be treated
  # as a plausible secret/credential when combined with a prod identifier
  # match nearby. Used by Rule (a).
  min_secret_entropy: 3.0

# ---------------------------------------------------------------------------
# Production Boundary Node (PBN): PROD-tagged AND structurally a resource
# boundary. Matched against node label / norm_label (case-insensitive
# substring match).
# ---------------------------------------------------------------------------
pbn_patterns:
  database:
    - "database"
    - "db"
    - "postgres"
    - "mysql"
    - "mongo"
    - "redis"
    - "sql"
    - "cursor"
    - "connection"
    - "session"
    - "orm"
    - "repository"
  storage:
    - "s3"
    - "bucket"
    - "blob"
    - "storage"
    - "filesystem"
    - "datalake"
  messaging:
    - "kafka"
    - "queue"
    - "topic"
    - "publisher"
    - "producer"
    - "sqs"
    - "sns"
    - "eventbus"
    - "broker"
  network:
    - "apiclient"
    - "httpclient"
    - "endpoint"
    - "webhook"
    - "gateway"

# ---------------------------------------------------------------------------
# Resource-client patterns: PRECISE library/client identifiers that
# unambiguously mean "this code talks to an external stateful resource"
# (a DB driver, a cloud SDK client, a queue producer). Unlike pbn_patterns
# (broad label substrings, PROD-gated), these fire REGARDLESS of env tag —
# because on real repos the resource itself usually sits in no prod/ folder;
# it's just "the database", reached by both prod and (leaking) non-prod code.
# A node matching one of these is a Production Boundary Node UNLESS it is an
# explicit local/test double (env DEV or TEST — e.g. a LocalDatabase stub).
# Matched as a case-insensitive substring against the node label/norm_label.
# ponytail: boto3.client type is arg-dependent (s3 vs sqs); we can't see the
# arg from the label, so it's mapped to storage (the canonical leak target) —
# scanner_findings (s3:// URIs) give precise typing when present.
resource_client_patterns:
  database:
    - "create_engine"
    - "sessionmaker"
    - "psycopg2"
    - "psycopg"
    - "pymysql"
    - "asyncpg"
    - "mongoclient"
    - "pymongo"
    - "sqlalchemy"
    - "databaseclient"
    - "db_connect"
  storage:
    - "boto3.client"
    - "boto3.resource"
    - "botocore"
    - "google.cloud.storage"
    - "storage.client"
    - "blobserviceclient"
    - "s3client"
    - "minio"
  messaging:
    - "kafkaproducer"
    - "kafkaconsumer"
    - "pika.blockingconnection"
    - "celery"
    - "sqsclient"

# ---------------------------------------------------------------------------
# Policy rule (b): edge relations counted as "writes to" / structurally
# reaches a PBN via calls/uses.
# ---------------------------------------------------------------------------
write_edge_relations:
  - "calls"
  - "instantiates"
  - "uses"

# ---------------------------------------------------------------------------
# Policy rule (c): non-prod sink labels (log/debug/dump destinations).
# ---------------------------------------------------------------------------
sink_patterns:
  - "log"
  - "logger"
  - "logging"
  - "debug"
  - "dump"
  - "print"
  - "console"
  - "trace"

# Sensitive-data keywords: PROD nodes whose label/norm_label matches one of
# these (in addition to database/storage PBNs) are treated as prod_data
# sources for Rule (c).
sensitive_data_keywords:
  - "user"
  - "customer"
  - "account"
  - "payment"
  - "email"
  - "password"
  - "ssn"
  - "credential"
  - "token"
  - "pii"

# ---------------------------------------------------------------------------
# Known hardcoded prod identifiers (Rule a). Literal substrings; matched
# case-insensitively against string content near a node's source_location.
# ---------------------------------------------------------------------------
known_prod_identifiers: []

# Reachability path reconstruction cap (simple-path enumeration is
# exponential in dense graphs; keep this small).
max_paths_per_finding: 10
max_path_length: 50

# ---------------------------------------------------------------------------
# Scanner patterns for discovery. (Replaces LocalG scanners with YAML config)
# ---------------------------------------------------------------------------
scanner_patterns:
  aws_arn: 'arn:aws[a-zA-Z-]*:[a-z0-9-]+:[a-z0-9-]*:[0-9]{0,12}:[^\s<>''"`\\]+'
  aws_s3_uri: 's3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](?:/[^\s<>''"`\\]*)?'
  database_url: '(?:(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|mssql|sqlserver)://|jdbc:[a-z0-9]+://)[^\s<>''"`\\]+'
  azure_resource_id: '/subscriptions/[0-9a-f-]{32,36}/resourceGroups/[^/\s<>''"`\\]+/providers/Microsoft\.[^/\s<>''"`\\]+/[^/\s<>''"`\\]+/[^/\s<>''"`\\]+'
  azure_storage_url: 'https?://[a-z0-9]{3,24}\.(?:blob|dfs|file|queue|table)\.core\.windows\.net'
  azure_key_vault: 'https?://[a-z0-9-]{3,24}\.vault\.azure\.net'
  gcp_gcs_uri: 'gs://[a-z0-9][a-z0-9._-]{1,221}[a-z0-9]'
  gcp_service_account: '[a-z0-9._%+-]+@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com'

# ---------------------------------------------------------------------------
# Specific high-confidence secret patterns (ported from LocalG)
# ---------------------------------------------------------------------------
secret_patterns:
  aws_access_key_id: '\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'
  private_key: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
