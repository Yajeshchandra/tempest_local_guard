[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempest-mcp"
version = "0.1.0"
description = "Local, non-prod-to-prod data leak detector exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "networkx>=3.0",
    "graphifyy>=0.9.4",
    "pyyaml>=6.0",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tempest-server = "tempest.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tempest = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
