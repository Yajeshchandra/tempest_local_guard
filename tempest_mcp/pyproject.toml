[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempest-mcp"
version = "0.1.0"
description = "Local, non-prod-to-prod data leak detector exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "networkx>=3.0",
    "graphifyy>=0.9.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tempest-server = "tempest.server:run"

[tool.setuptools.packages.find]
where = ["src"]

# config/tempest.default.yaml lives outside src/ (sibling to it) and is
# located at runtime via a filesystem-relative path in tempest.config
# (see load_default_config), not via package-data/importlib.resources.
# This means Tempest currently expects to run from an editable install
# (`pip install -e .`) or a source checkout, per the plan's install
# experience -- not a relocated wheel install.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
